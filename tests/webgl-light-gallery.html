<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>光效精修样板</title><style>
*{box-sizing:border-box}body{margin:0;background:#0c0f12;color:#dce2e8;font:14px Arial,'Microsoft YaHei',sans-serif}header{padding:24px 32px;border-bottom:1px solid #242a30}h1{font-size:23px;margin:0 0 10px}p{margin:0;color:#84909d;font-size:12px}.gallery{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:#252c32}.case{padding:22px 32px;background:#0c0f12;min-width:0}.case h2{font-size:15px;margin:0}.visual{height:330px;display:grid;place-items:center;overflow:hidden}.visual.wave>div{transform:scale(.92)}.check{background-color:#18212b;background-image:linear-gradient(45deg,#202b36 25%,transparent 25%),linear-gradient(-45deg,#202b36 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#202b36 75%),linear-gradient(-45deg,transparent 75%,#202b36 75%);background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0}.caption{display:flex;gap:10px;color:#84909d;font-size:12px}.caption a{color:#5ba5ff}button{background:#1c242e;color:#cbd7e2;border:1px solid #34414f;padding:6px 10px;border-radius:4px;cursor:pointer}footer{padding:20px 32px;display:flex;gap:12px;align-items:center}footer p{margin-left:auto}
@media(max-width:1000px){.gallery{grid-template-columns:1fr}.visual.wave>div{transform:scale(.8)}}
</style></head><body><header><h1>光效精修样板</h1><p>原生 WebGL · 无外链素材 · 透明背景 · 实时光纹理</p></header><main class="gallery"></main><footer><button id="background">切换透明检查背景</button><button id="replay">重播</button><p>先检查动态质感，再在编辑器调整颜色、强度和尺寸。</p></footer><script type="module">
import {lightDecorations} from '/src/data/lightDecorations.ts';
import {generateDecorationHtmlCss} from '/src/generators/decorationGenerator.ts';
const gallery=document.querySelector('.gallery');
for(const id of ['light-plasma-ring','light-silk-wave']){const effect=lightDecorations.find(e=>e.id===id);const section=document.createElement('section');section.className='case';section.innerHTML=`<h2>${effect.name}</h2><div class="visual ${id==='light-silk-wave'?'wave':''}"><div>${generateDecorationHtmlCss(effect,effect.defaultParams)}</div></div><div class="caption"><span>${effect.section} / ${effect.subsection}</span><a href="/tests/editor-layout.html?effect=${id}">进入编辑器</a><button class="download">下载独立 HTML</button></div>`;section.querySelector('.download').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([`<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#000}</style></head><body>${generateDecorationHtmlCss(effect,effect.defaultParams)}</body></html>`],{type:'text/html'}));a.download=effect.name+'.html';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};gallery.append(section)}
document.querySelector('#background').onclick=()=>document.querySelectorAll('.visual').forEach(n=>n.classList.toggle('check'));
document.querySelector('#replay').onclick=()=>document.querySelectorAll('dm-light-renderer').forEach(n=>n.seek(0));
const time=new URLSearchParams(location.search).get('time');if(time!==null)document.querySelectorAll('dm-light-renderer').forEach(n=>{n.setPlayback(false);n.seek(Number(time))});
document.title=[...document.querySelectorAll('dm-light-renderer')].every(n=>n.dataset.ready==='true')?'光效精修样板':'FAIL '+[...document.querySelectorAll('dm-light-renderer')].map(n=>n.dataset.error).join(';');
</script></body></html>
