<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" fill="none">
  <defs>
    <linearGradient id="chart-ring-line" x1="56" y1="56" x2="304" y2="304" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7AB8FF"/>
      <stop offset="0.48" stop-color="#0070F3"/>
      <stop offset="1" stop-color="#003B82"/>
    </linearGradient>
    <radialGradient id="chart-ring-glow" cx="0" cy="0" r="1" gradientTransform="translate(180 180) rotate(90) scale(156)" gradientUnits="userSpaceOnUse">
      <stop offset="0.62" stop-color="#0070F3" stop-opacity="0"/>
      <stop offset="0.8" stop-color="#0070F3" stop-opacity="0.12"/>
      <stop offset="0.94" stop-color="#4DA3FF" stop-opacity="0.36"/>
      <stop offset="1" stop-color="#0070F3" stop-opacity="0"/>
    </radialGradient>
    <filter id="chart-ring-soft-glow" x="-35%" y="-35%" width="170%" height="170%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <g id="glow">
    <circle cx="180" cy="180" r="158" stroke="#0070F3" stroke-opacity="0.16" stroke-width="16" filter="url(#chart-ring-soft-glow)"/>
    <circle cx="180" cy="180" r="151" fill="url(#chart-ring-glow)"/>
  </g>

  <g id="outer-ring">
    <circle cx="180" cy="180" r="154" stroke="#123F73" stroke-width="1"/>
    <circle cx="180" cy="180" r="148" stroke="url(#chart-ring-line)" stroke-width="3" stroke-linecap="round" stroke-dasharray="34 10 4 16"/>
  </g>

  <g id="inner-ring">
    <circle cx="180" cy="180" r="128" stroke="#0B2F58" stroke-width="9" stroke-dasharray="2 9"/>
    <circle cx="180" cy="180" r="118" stroke="#0070F3" stroke-opacity="0.72" stroke-width="2" stroke-dasharray="48 13 8 18"/>
  </g>

</svg>
